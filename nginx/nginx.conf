# ── HTTP: redirect to HTTPS (www → non-www) ───────────────────────
server {
    listen 80;
    server_name chocolaterospe.space;

    # Certbot usa este path para validar el dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS (sin www)
    location / {
        return 301 https://chocolaterospe.space$request_uri;
    }
}

server {
    listen 80;
    server_name www.chocolaterospe.space;

    # Certbot (por si se amplía el cert a www en el futuro)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # www siempre redirige a la URL canónica sin www
    location / {
        return 301 https://chocolaterospe.space$request_uri;
    }
}

# ── HTTPS www → redirige a no-www ─────────────────────────────────
# Si el cert no cubre www, el navegador mostrará advertencia SSL,
# pero una vez que se renueve con --expand, esto funcionará.
server {
    listen 443 ssl;
    server_name www.chocolaterospe.space;

    ssl_certificate     /etc/letsencrypt/live/chocolaterospe.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chocolaterospe.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://chocolaterospe.space$request_uri;
}

# ── HTTPS principal ────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name chocolaterospe.space;

    ssl_certificate     /etc/letsencrypt/live/chocolaterospe.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chocolaterospe.space/privkey.pem;

    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;

    # API del backend → proxy al contenedor backend
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes subidas → servidas por el backend
    location /uploads {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React → contenedor frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
