# Override para correr el stack completo localmente sin SSL
# Uso: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  backend:
    environment:
      NODE_ENV: development

  frontend:
    build:
      args:
        VITE_API_URL: http://localhost/api

  nginx:
    volumes:
      - ./nginx/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
    # Sobreescribe los certs de produccion (no existen localmente)
